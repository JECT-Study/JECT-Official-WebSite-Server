name: continuous integration

on:
  pull_request:
    branches:
      - 'main'
      - 'dev'

permissions:
  checks: write
  contents: write
  pages: write
  deployments: write
  pull-requests: write

jobs:
  check-application:
    runs-on: ubuntu-22.04
    services:
      docker:
        image: docker:24-dind
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://localhost:2375
      DOCKER_API_VERSION: "1.43"
      TESTCONTAINERS_CHECKS_DISABLE: "false"
      TESTCONTAINERS_RYUK_DISABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Docker service
        run: |
          for i in {1..30}; do
            if docker info > /dev/null 2>&1; then
              echo "Docker service is ready"
              exit 0
            fi
            echo "Waiting for Docker service... ($i/30)"
            sleep 2
          done
          echo "Docker service did not become ready in time"
          docker version || true
          exit 1

      - name: Check Docker
        run: |
          docker --version
          docker info
          id

      - name: Debug Runtime Environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Arch: $RUNNER_ARCH"
          echo "DOCKER_HOST=$DOCKER_HOST"
          echo "DOCKER_API_VERSION=$DOCKER_API_VERSION"
          env | sort | grep -E 'TESTCONTAINERS|DOCKER|CI|GITHUB_ACTIONS' || true

      - name: Verify Docker API Compatibility
        run: |
          docker version
          docker version --format '{{.Server.APIVersion}}'
          docker version --format '{{.Client.APIVersion}}'
          docker context ls

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Diagnose Testcontainers Runtime
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          echo "DOCKER_API_VERSION=$DOCKER_API_VERSION"
          echo "_JAVA_OPTIONS=$_JAVA_OPTIONS"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"
          printenv | sort | grep -E 'DOCKER|TESTCONTAINERS|JAVA_TOOL_OPTIONS|_JAVA_OPTIONS' || true
          docker version
          docker context ls
          ls -la ~/.testcontainers.properties || true
          cat ~/.testcontainers.properties || true

      - name: Dependency Insight for Docker/Testcontainers
        run: |
          ./gradlew -q dependencyInsight --dependency org.testcontainers:testcontainers --configuration testRuntimeClasspath
          ./gradlew -q dependencyInsight --dependency com.redis:testcontainers-redis --configuration testRuntimeClasspath
          ./gradlew -q dependencyInsight --dependency com.github.docker-java:docker-java-api --configuration testRuntimeClasspath
          ./gradlew -q dependencyInsight --dependency com.github.docker-java:docker-java-core --configuration testRuntimeClasspath
          ./gradlew -q dependencyInsight --dependency com.github.docker-java:docker-java-transport --configuration testRuntimeClasspath
          ./gradlew -q dependencyInsight --dependency com.github.docker-java:docker-java-transport-zerodep --configuration testRuntimeClasspath

      - name: Test with Gradle
        env:
          DOCKER_API_VERSION: "1.44"
        run: |
          printenv | grep -E 'DOCKER|TESTCONTAINERS' || true
          cat >/tmp/ci-testcontainers.init.gradle <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  systemProperty 'docker.api.version', '1.44'
                  systemProperty 'org.testcontainers.docker.client.strategy', 'org.testcontainers.dockerclient.UnixSocketClientProviderStrategy'
              }
          }
          EOF
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification \
            --info --stacktrace --no-daemon \
            -I /tmp/ci-testcontainers.init.gradle

      - name: Report Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml

      - name: Upload Jacoco Report
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          title: 📊테스트 커버리지
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 10
          min-coverage-changed-files: 10
          update-comment: true

      - name: Get the Coverage info
        run: |
          echo "Total coverage ${{ steps.jacoco.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.jacoco.outputs.coverage-changed-files }}"

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-debug-artifacts
          path: |
            build/reports/tests/test/**
            build/reports/jacoco/test/**
            build/test-results/test/**
            build/reports/problems/**
            .gradle/**
          if-no-files-found: warn
