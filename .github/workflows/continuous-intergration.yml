name: continuous integration

on:
  pull_request:
    branches:
      - 'main'
      - 'dev'

permissions:
  checks: write
  contents: write
  pages: write
  deployments: write
  pull-requests: write

jobs:
  check-application:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_API_VERSION: "1.44"
      TESTCONTAINERS_CHECKS_DISABLE: "false"
      TESTCONTAINERS_RYUK_DISABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker info
          ls -l /var/run/docker.sock
          id

      - name: Debug Runtime Environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Arch: $RUNNER_ARCH"
          echo "DOCKER_HOST=$DOCKER_HOST"
          echo "DOCKER_API_VERSION=$DOCKER_API_VERSION"
          env | sort | grep -E 'TESTCONTAINERS|DOCKER|CI|GITHUB_ACTIONS' || true

      - name: Ensure Docker daemon is running
        run: |
          if ! docker info > /dev/null 2>&1; then
            sudo systemctl start docker
            sleep 3
          fi
          docker info
          docker run --rm hello-world

      - name: Verify Docker API Compatibility
        run: |
          docker version
          docker version --format '{{.Server.APIVersion}}'
          docker version --format '{{.Client.APIVersion}}'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Test with Gradle
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --info --stacktrace

      - name: Report Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml

      - name: Upload Jacoco Report
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          title: 📊테스트 커버리지
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 10
          min-coverage-changed-files: 10
          update-comment: true

      - name: Get the Coverage info
        run: |
          echo "Total coverage ${{ steps.jacoco.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.jacoco.outputs.coverage-changed-files }}"

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-debug-artifacts
          path: |
            build/reports/tests/test/**
            build/reports/jacoco/test/**
            build/test-results/test/**
            build/reports/problems/**
            .gradle/**
          if-no-files-found: warn
